name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Unpack update zip into repo
        run: |
          git config core.quotepath off
          ZIP=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep -E '\.zip$' | head -1 || true)
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            echo "Unpacking: $ZIP"
            rm -rf app settings.gradle.kts
            unzip -qo "$ZIP"
            rm -f ./*.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Update sources from $ZIP" || true
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Тесты Kotlin. Пока не блокируют сборку: если упали, смотри лог этого шага.
      - name: Kotlin unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kairema-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Подписанный release APK: только если в Secrets есть ключ (docs/RELEASE_SETUP.md)
      - name: Decode release key
        id: key
        env:
          KS: ${{ secrets.KAIREMA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/kairema-release.jks"
            echo "have=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        id: rel
        if: steps.key.outputs.have == '1'
        continue-on-error: true
        env:
          KAIREMA_KEYSTORE: ${{ runner.temp }}/kairema-release.jks
          KAIREMA_STORE_PASS: ${{ secrets.KAIREMA_STORE_PASS }}
          KAIREMA_KEY_PASS: ${{ secrets.KAIREMA_STORE_PASS }}
          KAIREMA_KEY_ALIAS: kairema
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: steps.rel.outcome == 'success'
        with:
          name: kairema-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Релиз на GitHub для обновления из приложения: release APK, если собрался, иначе debug
      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${{ steps.rel.outcome }}" = "success" ]; then
            cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" "Kairema-$VER.apk"
          else
            cp "$(ls app/build/outputs/apk/debug/*.apk | head -1)" "Kairema-$VER.apk"
          fi
          NOTES=$(grep -m1 -F -- "- $VER:" docs/CHANGELOG.md | cut -c1-1400)
          gh release delete "v$VER" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VER" "Kairema-$VER.apk" --title "Kairema $VER" --notes "${NOTES:-Kairema $VER}" --target "$(git rev-parse HEAD)"
