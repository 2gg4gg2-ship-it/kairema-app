name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Unpack update zip into repo
        run: |
          git config core.quotepath off
          ZIP=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep -E '\.zip$' | head -1 || true)
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            echo "Unpacking: $ZIP"
            rm -rf app settings.gradle.kts
            unzip -qo "$ZIP"
            rm -f ./*.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Update sources from $ZIP" || true
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kairema-debug-apk
          path: app/build/outputs/apk/debug/*.apk
